<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giày runner Pro Foam — Shop Demo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shop">
      <article
        class="shop-card"
        data-nobita-product
        data-name="Giày runner Pro Foam"
        data-sku="SHOE-RUN-09"
        data-price="1290000"
        data-currency="VND"
        data-size="42"
        data-color="Xám bạc"
        data-stock="4"
        data-stock-status="in_stock"
      >
        <div class="shop-hero" style="background: linear-gradient(135deg, #0ea5e9, #0369a1)">Giày</div>
        <div class="shop-body">
          <h1 data-testid="product-title">Giày runner Pro Foam</h1>
          <div data-testid="product-sku">SKU: SHOE-RUN-09</div>
          <div class="price-lg" data-testid="product-price">1.290.000 ₫</div>

          <div>
            <div style="color: #5a6a7d; margin-bottom: 8px">Size</div>
            <div class="opt-row">
              <span class="opt" data-testid="size-option" data-size-option="40">40</span>
              <span class="opt" data-testid="size-option" data-size-option="41">41</span>
              <span class="opt" data-testid="size-option" data-size-option="42">42</span>
              <span class="opt" data-testid="size-option" data-size-option="43">43</span>
            </div>
            <div data-testid="product-size" hidden>42</div>
          </div>

          <div>
            <div style="color: #5a6a7d; margin-bottom: 8px">Màu</div>
            <div class="opt-row">
              <span class="opt" data-testid="color-option" data-color-option="Xám bạc">Xám bạc</span>
              <span class="opt" data-testid="color-option" data-color-option="Đen tuyền">Đen tuyền</span>
              <span class="opt" data-testid="color-option" data-color-option="Trắng kem">Trắng kem</span>
            </div>
            <div data-testid="product-color" hidden>Xám bạc</div>
          </div>

          <div>
            <span
              class="stock-banner in"
              data-testid="stock-status"
              data-stock-status="in_stock"
              >Còn hàng</span
            >
            <span data-testid="product-stock" style="margin-left: 8px; color: #5a6a7d">Tồn: 4</span>
          </div>
        </div>
      </article>
    </div>
  </body>
</html>
